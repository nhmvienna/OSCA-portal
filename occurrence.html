        <!-- Smooth scrolling -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
        <script>
            // handle links with @href started with '#' only
            $(document).on('click', 'a[href^="#"]', function (e) {
                // target element id
                var id = $(this).attr('href');

                // target element
                var $id = $(id);
                if ($id.length === 0) {
                    return;
                }

                // prevent standard hash navigation (avoid blinking in IE)
                e.preventDefault();

                // top position relative to the document
                var pos = $id.offset().top;

                // animated top scrolling
                $('body, html').animate({ scrollTop: pos });
            });
        </script>

        <script>

            // Utility function to convert camelCase strings to words
            function camelCaseToWords(input) {
                // Inserts a space before uppercase letters and converts the string to uppercase
                return input.replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase();
            }

            /**
             * Converts plain text URLs into clickable links that open in a new tab.
             * @param {string} text - The input text that may contain URLs.
             * @returns {string} - The text with URLs turned into HTML hyperlinks.
             */
            function linkifyText(text) {
                const urlRegex = /(\bhttps?:\/\/[^\s<>]+|\bwww\.[^\s<>]+)/gi;

                return text.replace(urlRegex, function (url) {
                    // Separate trailing punctuation (.,!?;:)
                    const match = url.match(/^(.*?)([.,!?;:|]+)?$/);
                    let coreUrl = match[1];
                    let trailing = match[2] || "";

                    // Add http if missing
                    let href = coreUrl;
                    if (!/^https?:\/\//i.test(href)) {
                        href = "http://" + href;
                    }

                    return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-blue-700 hover:underline">${coreUrl}</a>${trailing}`;
                });
            }


            // Function to process and display details for OSCA observations
            function displayDetailsOSCA(obs) {
                let rows = `
            <tr class="hover:bg-white text-left">
                <th class="border-t-0 px-3 align-middle text-xs whitespace-nowrap p-4">
                    ${camelCaseToWords('osca:uniqueID')}
                </th>
                <td class="break-words border-t-0 px-3 align-middle border-l-0 border-r-0 text-xs p-4">
                ${obs['osca:uniqueID']}
                </td>
            </tr>
            <tr class="hover:bg-white text-left">
                <th class="border-t-0 px-3 align-middle text-xs whitespace-nowrap p-4">
                    ${camelCaseToWords('dwc:occurrenceID')}
                </th>
                <td class="break-words border-t-0 px-3 align-middle border-l-0 border-r-0 text-xs p-4">
                ${obs['dwc:occurrenceID']}
                </td>
            </tr>
            `;

                let htmlKeysTemplate = `
        <table class="items-center w-full border shadow-lg rounded bg-p-orange-50 overflow-hidden">
            <thead>
                <tr>
                    <th class="w-1/4 px-3 bg-p-bluegray-50 text-p-bluegray-500 align-middle border-b py-3 text-xs uppercase whitespace-nowrap font-semibold text-left">
                        Observation Key
                    </th>
                    <th class="px-3 bg-p-bluegray-50 text-p-bluegray-500 align-middle border-b py-3 text-xs uppercase font-semibold text-left">
                        Observation Value
                    </th>
                </tr>
            </thead>
            <tbody  class="mt-12">
                ${rows}
            </tbody>
        </table>
        `;

                let dataRows = '';
                if (obs) {
                    for (const [key, value] of Object.entries(obs)) {
                        if (value && !key.includes('collection_number') && !key.includes('phisical_specimen_id')) {

                            dataRows +=
                                `
            <tr class="hover:bg-white text-left">
                <th class="border-t-0 px-3 align-middle text-xs whitespace-nowrap p-4">
                    ${camelCaseToWords(key)}
                </th>
                <td class="break-all border-t-0 px-3 align-middle border-l-0 border-r-0 text-xs p-4">
                ${typeof value === 'object' ? linkifyText(JSON.stringify(value)) : linkifyText(value)}
                </td>
            </tr>
            `;
                        }
                    }
                }

                let htmlDataTemplate = `
        <table class="items-center w-full border shadow-lg rounded bg-green-50 overflow-hidden">
            <thead>
                <tr>
                    <th class="w-1/4 px-3 bg-p-bluegray-50 text-p-bluegray-500 align-middle border-b py-3 text-xs uppercase whitespace-nowrap font-semibold text-left">
                        Observation Key
                    </th>
                    <th class="px-3 bg-p-bluegray-50 text-p-bluegray-500 align-middle border-b py-3 text-xs uppercase font-semibold text-left">
                        Observation Value
                    </th>
                </tr>
            </thead>
            <tbody  class="mt-12">
                ${dataRows}
            </tbody>
        </table>
        `;

                let dataOptionalRows = '';
                if (obs) {
                    for (const [key, value] of Object.entries(obs)) {
                        if (!value && !key.includes('collection_number') && !key.includes('phisical_specimen_id')) {

                            dataOptionalRows +=
                                `
            <tr class="hover:bg-white text-left">
                <th class="border-t-0 px-3 align-middle text-xs whitespace-nowrap p-4">
                    ${camelCaseToWords(key)}
                </th>
                <td class="break-all border-t-0 px-3 align-middle border-l-0 border-r-0 text-xs p-4">
                Leer oder nicht verfügbar
                </td>
            </tr>
            `;
                        }
                    }
                }

                let htmlOptionalDataTemplate = `
        <table class="items-center w-full border shadow-lg rounded bg-gray-50 overflow-hidden">
            <thead>
                <tr>
                    <th class="w-1/4 px-3 bg-p-bluegray-50 text-p-bluegray-500 align-middle border-b py-3 text-xs uppercase whitespace-nowrap font-semibold text-left">
                        Observation Key
                    </th>
                    <th class="px-3 bg-p-bluegray-50 text-p-bluegray-500 align-middle border-b py-3 text-xs uppercase font-semibold text-left">
                        Observation Value
                    </th>
                </tr>
            </thead>
            <tbody  class="mt-12">
                ${dataOptionalRows}
            </tbody>
        </table>
        `;

                let htmlTemplate =
                    `
        <div class="w-full px-4 py-2"> 
            <div class="pb-4"> <b> IDENTIFIKATIONSNUMMERN für </b> for <b class="text-p-blue-800">${obs['dwc:scientificName']}</b> </div>
            ${htmlKeysTemplate} 
            <div class="py-4"> <b> OCCURANCE DATEN mit Qualität </b> ${obs['dwc:associatedMedia'].length > 2 ? '<span class="ml-4 rounded-full py-1 px-3 bg-p-blue-700 font-bold text-white">MIDS 2</span>' : '<span class="ml-4 rounded-full py-1 px-3 bg-p-blue-700 font-bold text-white">MIDS 1</span>'} </div>
            ${htmlDataTemplate} 
            <div class="py-4 grid grid-cols-6 gap-4 items-center items-stretch">
                <img class="col-span-4 rounded-lg object-fill object-center shadow-lg" style="max-height:360px" src="./img/map-placeholder.jpg"/>
                <img class="rounded-lg object-fill object-center shadow-lg" srcset="${obs['dwc:associatedMedia']}" />
            </div>
            <div class="py-4"> <b> EXTRA OBSERVATION DATEN </b> </div>
            ${htmlOptionalDataTemplate} 
            
        </div>
        `;

                return htmlTemplate;
            }

            // Get the ID parameter from the URL
            function getIdParameter() {
                const params = new URLSearchParams(window.location.search);
                return params.get('id');
            }

            // Parse TSV text into an array of objects (assuming header row)
            function parseTSV(tsvText) {
                const lines = tsvText.trim().split('\n');
                const headers = lines[1].split('\t');
                return lines.slice(2).map(line => {
                    const values = line.split('\t');
                    const record = {};
                    headers.forEach((header, i) => {
                        record[header] = values[i];
                    });
                    return record;
                });
            }

            // Load TSV file and find record
            async function loadAndFindRecord(tsvUrl) {
                const id = getIdParameter();
                if (!id) {
                    document.getElementById('output').innerText = 'No ID parameter found in URL.';
                    return;
                }

                try {
                    const response = await fetch(tsvUrl);
                    const tsvText = await response.text();
                    const records = parseTSV(tsvText);

                    // Find record with matching id
                    const record = records.find(r => r['osca:uniqueID'] === id);

                    if (record) {
                        console.dir(record);
                        document.getElementById('output').innerHTML = displayDetailsOSCA(record);
                    } else {
                        document.getElementById('output').innerText = 'No record found for ID: ' + id;
                    }
                } catch (err) {
                    console.error('Error loading TSV:', err);
                    document.getElementById('output').innerText = 'Error loading TSV file.';
                }
            }

            // Call function with your .tsv file URL
            loadAndFindRecord('./data/osca-data.tsv?v=6'); // replace 'data.tsv' with your actual file path


            const id = getIdParameter();
            if (id) {
                console.log(`ID parameter is: ${id}`);
            } else {
                console.log('ID parameter not found.');
            }

        </script>
